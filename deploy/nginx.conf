# EazWorld — Nginx reverse proxy (frontend :3000, backend API :5000)
#
# ⚠️ BEFORE DEPLOYING, CONFIRM THE CERTIFICATE PATHS BELOW.
#    They follow Let's Encrypt's usual layout for this domain, but the actual
#    lineage name is whatever certbot chose when the cert was first issued.
#    Check with:  sudo certbot certificates
#    and make ssl_certificate / ssl_certificate_key match its "Certificate Path"
#    and "Private Key Path" exactly. A wrong path here means the site does not
#    serve at all.

# ── HTTP → HTTPS ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name eazworld.co www.eazworld.co;

    # Leave ACME renewals reachable over plain HTTP, or certbot's webroot
    # renewal fails once this redirect is in place.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eazworld.co www.eazworld.co;

    ssl_certificate     /etc/letsencrypt/live/eazworld.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eazworld.co/privkey.pem;

    # ── TLS hardening (T95) ─────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # HSTS. Deliberately WITHOUT `preload`: preloading is baked into browsers
    # and is painful to reverse, so it should be a separate, deliberate step
    # once the certificate renewal has been proven over a few cycles.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Upload size (T81) ───────────────────────────────────────────────────
    # MUST stay above the app's own limits, or Nginx rejects the request with a
    # 413 the app never sees and the user gets no useful error. Keep in step:
    #   multer  limits.fileSize   = 5MB  (controllers/uploadController.js:15)
    #   express.json limit        = 5mb  (app.js:104)
    # 6m leaves headroom for multipart overhead so the APP owns the error.
    client_max_body_size 6m;

    # ── Frontend (Next.js) ──────────────────────────────────────────────────
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Backend API ─────────────────────────────────────────────────────────
    # Covers every backend route, including the Paystack webhook at
    # /api/webhooks/paystack. (A separate location for
    # /api/v1/domain/webhook used to sit here — that route does not exist; it
    # was left over from the retired Namecheap integration, and /api/ already
    # proxies to the same upstream regardless.)
    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # app.js sets `trust proxy 1`; without this the app cannot tell an
        # HTTPS request from a plain one behind the proxy.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://localhost:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
