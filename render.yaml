services:
  - type: web
    name: eazworld-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_COOKIE_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: PAYSTACK_KEY
        sync: false
      - key: PAYSTACK_SECRET
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: NAMECHEAP_API_USER
        sync: false
      - key: NAMECHEAP_API_KEY
        sync: false
      - key: NAMECHEAP_CLIENT_IP
        sync: false
      - key: NAMECHEAP_SANDBOX
        value: false
      - key: WHM_HOST
        sync: false
      - key: WHM_USER
        value: root
      - key: WHM_TOKEN
        sync: false
      - key: CPANEL_URL
        sync: false
